<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Nimbo — Legal / Yasal</title>
<style>
:root { --accent: #6105FF; --text: #1E1433; --muted: #5B5470; --line: #E7E3F0; --soft: #F4F0FF; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: #FFFFFF; color: var(--text);
  font: 17px/1.6 -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "Segoe UI", Roboto, sans-serif; }
main { max-width: 680px; margin: 0 auto; padding: 24px 16px 64px; }
header.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 8px; }
.brand { font-weight: 700; color: var(--accent); text-decoration: none; font-size: 18px; }
.lang { font-size: 15px; color: var(--accent); text-decoration: none; padding: 6px 12px; border: 1.5px solid var(--accent); border-radius: 999px; }
h1 { font-size: 28px; line-height: 1.25; margin: 16px 0 12px; }
h2 { font-size: 20px; margin: 32px 0 8px; padding-top: 8px; border-top: 1px solid var(--line); }
p, li { color: var(--text); }
a { color: var(--accent); }
ul { padding-left: 22px; }
li { margin: 4px 0; }
strong { font-weight: 650; }
.table { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 15px; margin: 12px 0; }
th, td { border: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
th { background: var(--soft); }
footer { margin-top: 48px; font-size: 14px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 16px; }
footer a { margin-right: 14px; }
.choices { display: grid; gap: 12px; margin-top: 24px; }
.choice { display: block; padding: 16px 18px; border: 1.5px solid var(--line); border-radius: 16px; text-decoration: none; color: var(--text); }
.choice strong { color: var(--accent); display: block; font-size: 18px; }
.choice span { color: var(--muted); font-size: 15px; }
</style>
</head>
<body>
<main>
<header class="top"><span class="brand">Nimbo</span></header>

</body>
</html>
